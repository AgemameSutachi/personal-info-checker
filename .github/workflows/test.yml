name: 試験

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: 依存を入れる
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: 書式（black）
        run: python -m black --check pii_checker tests build.py entry_app.py entry_cli.py
      - name: 試験
        run: python -m pytest tests -q -rs
