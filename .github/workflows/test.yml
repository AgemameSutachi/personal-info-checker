name: 試験

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - name: 依存を入れる
        # 版は constraints.txt で手元と同じにそろえる（新しい版を拾って突然落ちないように）
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt
      - name: 書式（black）
        run: python -m black --check pii_checker tests tools build.py entry_app.py entry_cli.py
      - name: 試験
        run: python -m pytest tests -q -rs
