name: 試験

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - name: 依存を入れる
        # 版は constraints.txt で手元と同じにそろえる（新しい版を拾って突然落ちないように）
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt
      - name: 書式（black）
        run: python -m black --check pii_checker tests tools build.py entry_app.py entry_cli.py
      - name: Rust 拡張（pii_rs_detect）を作って入れる
        # windows-latest には rustup/cargo が入っている。作れなければここで落とす（拡張ありの試験を素通りさせない）
        run: python tools/build_rust_ext.py --strict
      - name: 試験（Rust 拡張あり）
        run: python -m pytest tests -q -rs
      - name: 試験（Rust 拡張なし・検出の試験だけ）
        # 拡張が無い環境（cargo の無い開発機・Rust を作れなかった配布）と同じ動きを確かめる
        env:
          PII_CHECKER_NO_RUST: "1"
        run: python -m pytest tests/test_detectors.py tests/test_detect_speedup.py tests/test_address_context.py tests/test_cli.py tests/test_rust_patterns.py -q -rs
